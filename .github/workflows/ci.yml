name: CI — testlar

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    name: jsdom testlari (68 tekshiruv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Bog'liqliklarni o'rnatish
        run: npm install --no-audit --no-fund
      - name: Kun/Tun/Avto, rasm swap va modal testlari
        run: npm test
